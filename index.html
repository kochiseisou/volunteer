<style>
:root{
  --bg:#fff;--ink:#1b2125;--sub:#37424a;
  --main:#2f5be0;--deep:#13265a;--pale:#e5edfc;--soft:#f1f5fe;--line:#cfdcf6;--lab:#86a1ea;
  --alert:#d6335a;--alertbg:#fdecf1;--amber:#a35f00;--amberbg:#fff4de;--green:#0d6b4a;--gray:#4a5668;
  --r:10px;
  --ease:cubic-bezier(.22,.7,.2,1);
  interpolate-size:allow-keywords;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.8}
a{color:var(--main)}
button{font:inherit}

/* ---------- 表紙 ---------- */
.hero{background:var(--pale);padding:44px 20px 40px;text-align:center}
.mark{display:block;width:152px;height:152px;margin:0 auto 16px;object-fit:contain}
.org{margin:0;font-size:1rem;font-weight:700;letter-spacing:.14em;color:var(--deep)}
h1{margin:2px 0 0;font-size:clamp(1.9rem,6.4vw,2.7rem);line-height:1.35;font-weight:700;letter-spacing:.1em;color:var(--deep)}
.lead{margin:10px auto 0;max-width:34em;font-size:.95rem;color:var(--sub)}
.next{display:flex;align-items:center;gap:12px;max-width:600px;margin:26px auto 0;width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.next:hover{transform:translateY(-2px);border-color:var(--lab);box-shadow:0 6px 16px rgba(30,50,110,.10)}
.nlab{flex:none;background:var(--main);color:#fff;font-size:.74rem;font-weight:700;border-radius:3px;padding:1px 9px;line-height:1.6}
.ndate{flex:none;font-weight:700;color:var(--main);font-size:.92rem}
.ntitle{min-width:0;flex:1;overflow:hidden;white-space:nowrap;font-weight:700;font-size:.92rem}
.ntitle.run{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.mq{display:inline-flex}
.mt{flex:none;padding-right:48px}
.ntitle.run .mq{animation:marq var(--d,12s) linear infinite}
.next:hover .ntitle.run .mq{animation-play-state:paused}
.narr{flex:none;color:var(--main);font-size:1.3rem;line-height:1}
.hero>*{animation:rise .8s var(--ease) both}
.hero .mark{animation-name:pop;animation-duration:.9s;animation-delay:.05s}
.hero .org{animation-delay:.15s}
.hero h1{animation-delay:.22s}
.hero .lead{animation-delay:.3s}
.hero .next{animation-delay:.4s}

.statuswrap{max-width:760px;margin:16px auto 0;padding:0 20px}
.demo-bar,.warn-bar{padding:9px 16px;border-radius:var(--r);font-size:.9rem;font-weight:700}
.demo-bar{background:var(--amberbg);border:1px solid var(--amber);color:#5c3500}
.warn-bar{background:var(--alertbg);border:1px solid var(--alert);color:#7a1630}

/* ---------- ナビ（パソコン：上に固定／スマホ：下に固定） ---------- */
.nav{position:sticky;top:0;z-index:30;margin-top:20px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{position:relative;display:flex;justify-content:center;max-width:760px;margin:0 auto}
.nav a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 22px;color:var(--deep);font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;transition:color .3s}
.nav a:hover,.nav a[aria-current="true"]{color:var(--main)}
.nav a:focus-visible{outline:2px solid var(--main);outline-offset:-4px}
.ti svg{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ind{position:absolute;z-index:2;left:0;bottom:-1px;height:3px;width:0;background:var(--main);transition:transform .45s var(--ease),width .45s var(--ease)}

/* ---------- 各セクション ---------- */
.sec{max-width:760px;margin:0 auto;padding:56px 20px 0;scroll-margin-top:36px}
.fine{margin:-6px 0 18px;font-size:.92rem;line-height:1.8;color:var(--ink)}
.fine a{color:var(--main);font-weight:700;text-underline-offset:3px}
.fine a:hover{color:var(--deep)}
h2{position:relative;display:flex;align-items:baseline;gap:12px;margin:0 0 22px;padding-bottom:12px;font-size:1.5rem;line-height:1.4;font-weight:700;letter-spacing:.06em;color:var(--deep);border-bottom:1px solid var(--line)}
h2::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:3px;background:var(--main)}
h2 .cnt{margin-left:auto;font-size:.85rem;font-weight:700;letter-spacing:0;color:var(--sub)}
.empty{color:var(--sub);padding:12px 0}

.js .rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0) * 60ms)}
.js .rv.in{opacity:1;transform:none}

/* お知らせ */
.nitem{background:var(--soft);border-radius:var(--r);padding:16px 22px;margin-bottom:12px;transition:transform .35s var(--ease),box-shadow .35s}
.nitem:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,50,110,.08)}
.nitem.imp{background:var(--alertbg)}
.nitem.ntc{background:var(--amberbg)}
.nhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.nd{background:#fff;border-radius:4px;padding:0 13px;line-height:1.7;font-size:.88rem;font-weight:700;color:var(--main);font-variant-numeric:tabular-nums}
.tag{font-size:.74rem;font-weight:700;color:#fff;background:var(--alert);border-radius:3px;padding:0 9px;line-height:1.6}
.tag.ntc{background:var(--amber)}
.nt{font-weight:700}
.nb{margin:4px 0 0;font-size:.95rem;white-space:pre-line;overflow-wrap:anywhere}
.nmore{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:700}

/* 募集カード（＋でひらく） */
details{border:2px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:border-color .3s,box-shadow .35s}
details:hover{border-color:var(--lab)}
details[open]{box-shadow:0 6px 18px rgba(30,50,110,.08)}
details::details-content{block-size:0;overflow:clip;transition:block-size .4s var(--ease),content-visibility .4s allow-discrete}
details[open]::details-content{block-size:auto}
details[open]>.dbody{animation:fade .5s ease both}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:16px;padding:14px 18px;transition:color .3s}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--main)}
summary:focus-visible{outline:2px solid var(--main);outline-offset:-2px}
summary::after{content:"+";display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto;width:30px;height:30px;border:2px solid var(--main);border-radius:4px;color:var(--main);font-size:1.1rem;font-weight:700;line-height:1;transition:background .3s,color .3s}
summary:hover::after{background:var(--main);color:#fff}
details[open]>summary::after{content:"−"}
.sd{flex:none;min-width:5.8em;text-align:center;background:var(--main);color:#fff;border-radius:4px;padding:4px 10px;font-size:.92rem;font-weight:700;line-height:1.5}
.sd.ev{background:var(--deep)}
.sbody{min-width:0;flex:1}
.st{display:block;font-weight:700;line-height:1.55}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.bdg{display:inline-block;font-weight:900;font-size:.8rem;line-height:1.6;padding:1px 10px;border-radius:999px;border:2px solid transparent;white-space:nowrap}
.bdg.hot{background:#e07600;color:#fff;animation:softpulse 2.2s ease-in-out infinite}
.bdg.urgent{background:#d4183d;color:#fff}
.bdg.few{background:#fff;color:#d4183d;border-color:#d4183d;animation:softpulse 2.2s ease-in-out infinite}
.bdg.left{background:#fff;color:var(--main);border-color:var(--main)}
.bdg.dl{background:#fff3de;color:#7a3f00;border-color:#e07600}
.bdg.live{background:var(--green);color:#fff}
.bdg.full,.bdg.closed{background:var(--gray);color:#fff}
.bdg.type{background:var(--pale);color:var(--deep)}
.dbody{background:var(--soft);padding:14px 22px 20px}
dl{margin:0;display:grid;grid-template-columns:5em 1fr;gap:4px 14px;font-size:.95rem}
dt{color:var(--sub);font-size:.88rem;font-weight:700}
dd{margin:0;word-break:break-word}
.bl{margin:0;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 9px;font-size:.88rem}
.act{margin-top:16px}
details.closed{background:#f6f7f9}
details.closed .sd{background:var(--gray)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--main);border-radius:var(--r);padding:10px 30px;font-weight:700;text-decoration:none;cursor:pointer;background:#fff;color:var(--main);transition:background .3s,color .3s,transform .35s var(--ease),border-color .3s}
.btn:hover{transform:translateY(-2px)}
.btn.fill{background:var(--main);color:#fff}
.btn.fill:hover{background:var(--deep);border-color:var(--deep)}
.btn.line:hover{background:var(--soft)}
.btn.off{background:#e4e8ee;border-color:#aab4c3;color:var(--gray);cursor:not-allowed}
.btn.off:hover{transform:none}
.btn .ico{width:15px;height:15px;flex:none}
.btn:focus-visible{outline:3px solid var(--deep);outline-offset:3px}

/* リンク（小さめ） */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;color:inherit;text-decoration:none;min-width:0;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s}
.lk:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,50,110,.12);border-color:var(--main)}
.ic{display:flex;flex:none;width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--main);align-items:center;justify-content:center;transition:transform .4s var(--ease)}
.lk:hover .ic{transform:scale(1.08) rotate(-3deg)}
.ic svg{width:20px;height:20px}
.ic svg.ln{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lnm{display:block;font-weight:700;font-size:.9rem;line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 連絡先 */
.who{font-weight:700;font-size:1.15rem;margin-bottom:4px}
.hours{margin:0 0 14px;font-size:.92rem;color:var(--sub)}
.cb{display:flex;gap:12px;flex-wrap:wrap}
.addr{margin:12px 0 0;font-size:.9rem;color:var(--sub);word-break:break-all}

.sk{height:60px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
main{padding-bottom:40px}

/* フッター */
.foot{background:var(--pale);padding:28px 20px 22px;text-align:center}
.foot .upd{margin:0;font-weight:700;color:var(--deep);font-size:.88rem}
.foot .small{margin:2px 0 0;font-size:.8rem;color:var(--sub)}
.adm{display:block;margin:14px auto 0;padding:2px 10px;border:0;background:none;font:inherit;font-size:.7rem;color:#9aa6bd;text-decoration:underline;text-underline-offset:2px;cursor:pointer;transition:color .3s}
.adm:hover,.adm:focus-visible{color:var(--main)}

/* 右下：ホームに戻る・先頭へ（常に表示） */
.fabs{position:fixed;right:16px;bottom:20px;z-index:40;display:flex;flex-direction:column;gap:8px}
.fab{width:52px;height:52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--main);font:inherit;font-size:.62rem;font-weight:700;letter-spacing:.02em;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px rgba(20,38,90,.22);transition:background .3s,color .3s,transform .35s var(--ease)}
.fab:hover{transform:translateY(-3px)}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
.fab.home{background:#fff;color:var(--main)}
.fab.home:hover{background:var(--soft)}
.fab.top{background:var(--main);color:#fff}
.fab.top:hover{background:var(--deep);border-color:var(--deep)}
.fab.top:hover svg{transform:translateY(-3px)}
.fab:focus-visible,.egg:focus-visible{outline:3px solid var(--deep);outline-offset:3px}

/* 左下：ごみ拾いのアイコン（小さく薄く。押すと画面いっぱいにアニメーション） */
.egg{position:fixed;left:14px;bottom:14px;z-index:35;width:40px;height:40px;padding:0;border:0;background:none;color:var(--main);opacity:0;visibility:hidden;pointer-events:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s,transform .45s var(--ease)}
.egg.show{opacity:.28;visibility:visible;pointer-events:auto}
.egg svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.egg.show:hover,.egg.show:focus-visible{opacity:.8;transform:rotate(-12deg)}
.fx{position:fixed;inset:0;z-index:100;cursor:pointer;touch-action:none}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fxmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:92vw;text-align:center;pointer-events:none;opacity:0}
.fxmsg.show{opacity:1}
.fxlogo{display:block;width:120px;height:120px;margin:0 auto 8px;border-radius:50%;box-shadow:0 8px 28px rgba(20,38,90,.28)}
.fxbig{font-size:clamp(2.1rem,9vw,4rem);line-height:1.25;font-weight:900;letter-spacing:.06em;color:var(--deep);-webkit-text-stroke:10px #fff;paint-order:stroke fill}
.fxsub{display:inline-block;margin-top:8px;padding:4px 20px;border-radius:6px;background:var(--main);color:#fff;font-weight:700;font-size:1.05rem}
.fxmsg.show .fxlogo{animation:spinin 1s var(--ease) both}
.fxmsg.show .fxbig{animation:bigpop .7s cubic-bezier(.3,1.6,.5,1) .15s both}
.fxmsg.show .fxsub{animation:rise .6s var(--ease) .5s both}

@keyframes softpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(224,118,0,0)}50%{transform:scale(1.05);box-shadow:0 0 0 5px rgba(224,118,0,.16)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes marq{to{transform:translateX(calc(-1 * var(--w)))}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spinin{from{opacity:0;transform:rotate(-360deg) scale(.2)}to{opacity:1;transform:none}}
@keyframes bigpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

@media(max-width:720px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .fabs{right:12px;bottom:calc(64px + env(safe-area-inset-bottom) + 12px)}
  .egg{left:8px;bottom:calc(64px + env(safe-area-inset-bottom) + 8px)}
  .hero{padding:32px 16px 32px}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;background:var(--main);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(20,30,80,.18)}
  .navin{max-width:none}
  .nav a{flex:1 1 0;flex-direction:column;gap:2px;padding:8px 2px 7px;color:#fff;font-size:.68rem}
  .nav a:hover{color:#fff}
  .nav a[aria-current="true"]{color:#fff;background:rgba(255,255,255,.18)}
  .ti svg{display:block}
  .ind{top:0;bottom:auto;background:#fff;border-radius:0 0 3px 3px}
  .sec{padding-top:44px;scroll-margin-top:8px}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .lk{padding:8px 10px;gap:8px}
  .lnm{white-space:normal;font-size:.84rem;line-height:1.35}
}
@media(max-width:560px){
  .mark{width:128px;height:128px}
  .next{padding:9px 12px;gap:8px}
  .ndate{font-size:.85rem}
  .ntitle{font-size:.85rem}
  h2{font-size:1.3rem}
  summary{flex-wrap:wrap;gap:6px 10px;padding:12px 44px 12px 14px;position:relative}
  summary::after{position:absolute;right:10px;top:12px}
  .sd{flex:0 0 auto;min-width:0;font-size:.85rem}
  .sbody{flex:0 0 100%}
  .dbody{padding:12px 14px 16px}
  dl{grid-template-columns:1fr;gap:0}
  dt{margin-top:6px}
  .nitem{padding:14px 16px}
}
.sd.qa{min-width:2.4em;padding:4px 0}
.fc{display:flex;align-items:flex-start;gap:12px;width:100%;margin-bottom:8px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--r);background:#fff;color:inherit;text-align:left;cursor:pointer;transition:border-color .3s,box-shadow .35s,transform .35s var(--ease)}
.fc:hover{border-color:var(--main);box-shadow:0 6px 16px rgba(30,50,110,.1);transform:translateY(-2px)}
.fc:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.fc .sd{font-size:.82rem;min-width:5em;padding:2px 8px;margin-top:2px}
.fc .sbody{min-width:0;flex:1}
.fc .st{font-size:.95rem}
.fc .bdg{font-size:.72rem}
.fc .fct{margin:4px 0 0;font-size:.88rem;line-height:1.6;color:var(--sub)}
.fc .fct ul{margin:0;padding-left:1.2em}
.fc .go{flex:none;align-self:center;color:var(--main);font-size:1.2rem;line-height:1;transition:transform .35s var(--ease)}
.fc:hover .go{transform:translateY(3px)}
#featured{padding-top:40px}
#featured h2{margin-bottom:14px;font-size:1.25rem}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(47,91,224,0)}30%{box-shadow:0 0 0 6px rgba(47,91,224,.25)}}
details.hit{animation:flash 1.6s ease 1}
@media(max-width:560px){.fc{flex-wrap:wrap;gap:6px 10px}.fc .sbody{flex:1 1 100%;order:3}.fc .go{margin-left:auto;order:2}}
@media(max-width:560px){details.faq summary{flex-wrap:nowrap;gap:10px}details.faq .sbody{flex:1 1 0}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ntitle{text-overflow:ellipsis}
  .mq{display:block;overflow:hidden;text-overflow:ellipsis}
  .mt{display:inline;padding:0}
  .mt+.mt{display:none}
  .ntitle.run{-webkit-mask-image:none;mask-image:none}
  .js .rv{opacity:1;transform:none}
}

/* 管理者画面 */
dialog{border:0;border-radius:var(--r);padding:0;width:min(760px,94vw);max-height:90vh;color:var(--ink);font:inherit;background:#fff;box-shadow:0 20px 50px rgba(19,38,90,.35)}
dialog::backdrop{background:rgba(19,38,90,.5)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--deep);color:#fff;position:sticky;top:0;z-index:2}
.dlg-head h2{margin:0;padding:0;border:0;font-size:1.05rem;letter-spacing:.06em;color:#fff;flex:1;display:block}
.dlg-head h2::after{display:none}
.dlg-head .x{background:transparent;border:1px solid #fff;border-radius:6px;color:#fff;font-weight:700;cursor:pointer;padding:2px 14px}
.dlg-head .x:hover{background:rgba(255,255,255,.16)}
.dlg-body{padding:18px}
.pin-form{display:grid;gap:12px;max-width:320px;margin:10px auto;text-align:center}
.pin-form input{font:inherit;font-size:1.7rem;letter-spacing:.5em;text-align:center;padding:8px;border:2px solid var(--line);border-radius:var(--r);width:100%;color:var(--ink)}
.pin-form input:focus{outline:none;border-color:var(--main)}
.err{color:var(--alert);font-weight:700;min-height:1.5em;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:var(--r);padding:10px 14px}
.kpi span{display:block;font-weight:700;color:var(--sub);font-size:.85rem}
.kpi b{font-size:1.9rem;font-weight:700;color:var(--deep);line-height:1.3}
.kpi small{font-weight:700;color:var(--sub)}
.adm-h{margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:1rem;font-weight:700;color:var(--deep)}
.legend{display:flex;gap:14px;font-weight:700;font-size:.85rem;margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px;text-align:right}
.tbl th{color:var(--deep);font-weight:700;background:var(--soft)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl .bar{height:5px;border-radius:3px;background:var(--main);margin-top:3px}
.adm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tiny{font-size:.82rem;font-weight:700;color:var(--sub)}
</style>
</head>

/* =========================================================
   ユーティリティ
   ========================================================= */
const $ = id => document.getElementById(id);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const nl2br = s => esc(s).replace(/\n/g,'<br>');
const safeUrl = u => { try { const x = new URL(u, location.href); return /^(https?:|mailto:)$/.test(x.protocol) ? x.href : ''; } catch(e){ return ''; } };
const isNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));

const dtf = new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit',hour12:false});
const P = d => { const o={}; dtf.formatToParts(d).forEach(p=>o[p.type]=p.value); if(o.hour==='24')o.hour='0'; return o; };
const hm = d => { const p=P(d); return `${p.hour}:${p.minute}`; };
const fmtD = (d,y) => { const p=P(d); return `${y?p.year+'年':''}${p.month}月${p.day}日(${p.weekday})`; };
const fmtDT = (d,y) => `${fmtD(d,y)} ${hm(d)}`;
const dayNum = d => Math.floor((d.getTime()+9*3600000)/86400000);
const thisYear = () => P(new Date()).year;
const shortD = d => { const p=P(d); return `${p.month}/${p.day}(${p.weekday})`; };

function chipDate(it){
  if (!it.start) return t('chip.always');
  const s = new Date(it.start), e = it.end ? new Date(it.end) : null;
  return (e && dayNum(e) !== dayNum(s)) ? `${shortD(s)}〜${shortD(e)}` : shortD(s);
}
function dateText(it){
  if (it.dateText) return it.dateText;
  if (!it.start) return '';
  const s = new Date(it.start), e = it.end ? new Date(it.end) : null;
  if (!e) return fmtDT(s);
  return dayNum(s)===dayNum(e) ? `${fmtD(s)} ${hm(s)}〜${hm(e)}` : `${fmtDT(s)}〜${fmtDT(e)}`;
}
function deadlineText(it){
  if (!it.deadline) return t('deadline.none');
  const d = new Date(it.deadline);
  return t('deadline.format').replace('{date}', fmtDT(d, P(d).year !== thisYear()));
}
function bullets(v){
  const raw = String(v||'').trim(); if(!raw) return '';
  if (raw.startsWith('・') || raw.includes('\n')) {
    const ps = raw.split(/\n|・/).map(s=>s.trim()).filter(Boolean);
    return ps.length>1 ? '<ul class="bl">'+ps.map(p=>`<li>${esc(p)}</li>`).join('')+'</ul>' : esc(ps[0]||'');
  }
  return nl2br(raw);
}
function chips(v){
  const ps = String(v||'').split(/\n|・/).map(s=>s.trim()).filter(Boolean);
  return ps.length ? '<div class="chips">'+ps.map(p=>`<span class="chip">${esc(p)}</span>`).join('')+'</div>' : '';
}

/* =========================================================
   状態判定
   ========================================================= */
function status(it, now){
  const s = it.start ? new Date(it.start) : null, e = it.end ? new Date(it.end) : null, d = it.deadline ? new Date(it.deadline) : null;
  const o = { ended: !!(e && now > e), live: !!(s && e && now >= s && now <= e), closed: !!(d && now > d), left: null, full: false, dl: '' };
  if (isNum(it.capacity)) { o.left = Math.max(0, Number(it.capacity) - Number(isNum(it.applied)?it.applied:0)); o.full = o.left === 0; }
  if (d && !o.closed) {
    const diff = dayNum(d) - dayNum(now);
    if (diff === 0) o.dl = t('badge.today'); else if (diff <= 3) o.dl = t('badge.days').replace('{n}', diff);
  }
  return o;
}
const isEvent = it => String(it.type||'').includes('イベント');

function badgeHtml(it, st){
  const b = [];
  if (st.live) b.push(['live', t('badge.live')]);
  if (it.featured) b.push(['hot', t('badge.featured')]);
  if (it.badge) b.push(['urgent', t('badge.urgent_prefix') + it.badge]);
  if (st.closed) b.push(['closed', t('badge.closed')]);
  else if (st.full) b.push(['full', t('badge.full')]);
  else {
    if (st.left !== null) b.push([st.left<=5?'few':'left', t(st.left<=5?'badge.left_few':'badge.left').replace('{n}', st.left).replace('{unit}', it.unit || t('badge.unit'))]);
    if (st.dl) b.push(['dl', st.dl]);
  }
  return b.length ? '<span class="badges">'+b.map(([c,x])=>`<span class="bdg ${c}">${esc(x)}</span>`).join('')+'</span>' : '';
}

/* 申込ボタン（外部ページへ移動する、青い実線ボタン） */
function applyBtn(it, st){
  const url = safeUrl(it.url);
  if (st.closed) return `<span class="btn off">${esc(t('btn.closed'))}</span>`;
  if (st.full) return `<span class="btn off">${esc(t('btn.full'))}</span>`;
  if (!url) return '';
  const label = it.btn || (isEvent(it) ? t('btn.detail') : t('btn.apply'));
  return `<a class="btn fill" href="${esc(url)}" target="_blank" rel="noopener" data-track data-kind="apply" data-id="${esc(it.id)}" data-label="${esc(it.title)}">${esc(label)}${ICON_EXT}</a>`;
}

/* =========================================================
   描画
   ========================================================= */
const row = (l, v) => v ? `<dt>${esc(l)}</dt><dd>${v}</dd>` : '';

function cardHtml(it, now, key){
  const st = status(it, now);
  const rows = row(t('row.date'), esc(dateText(it))) + row(t('row.place'), esc(it.place)) + row(t('row.deadline'), esc(deadlineText(it)))
    + row(t('row.content'), bullets(it.content)) + row(t('row.host'), esc(it.host)) + row(t('row.bring'), esc(it.bring))
    + row(t('row.cert'), esc(it.cert)) + row(t('row.note'), chips(it.note));
  const act = applyBtn(it, st);
  return `<details data-key="${esc(key)}" data-id="${esc(it.id)}" class="${st.closed||st.full?'closed':''}">
    <summary><span class="sd ${isEvent(it)?'ev':''}">${esc(chipDate(it))}</span><span class="sbody"><span class="st">${esc(it.title)}</span>${badgeHtml(it, st)}</span></summary>
    <div class="dbody"><dl>${rows}</dl>${act ? `<div class="act">${act}</div>` : ''}</div></details>`;
}

/* 回答の中の http(s):// で始まる文字を、押せるリンクにする */
function linkify(text){
  return esc(text).replace(/https?:\/\/[^\s<>"'）)」]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\n/g, '<br>');
}
function faqHtml(f, i){
  return `<details class="faq" data-key="q:${i}" data-id="faq:${i}" data-label="${esc(f.q)}"><summary><span class="sd qa">Q</span><span class="sbody"><span class="st">${esc(f.q)}</span></span></summary><div class="dbody"><p class="nb">${linkify(f.a)}</p></div></details>`;
}

/* 注目の募集：内容だけを常に表示。押すと、下の一覧の同じ募集へ移動して開く */
function featHtml(it){
  const c = bullets(it.content);
  return `<button type="button" class="fc" data-go-item="${esc(it.id)}"><span class="sd ${isEvent(it)?'ev':''}">${esc(chipDate(it))}</span><span class="sbody"><span class="st">${esc(it.title)}</span>${badgeHtml(it, status(it, new Date()))}${c ? `<div class="fct">${c}</div>` : ''}</span><span class="go" aria-hidden="true">↓</span></button>`;
}
function goItem(id){
  const d = document.querySelector(`#volList details[data-key="${CSS.escape(id)}"], #evList details[data-key="${CSS.escape(id)}"]`);
  if (!d) return;
  d.open = true; openKeys.add(d.dataset.key);
  d.scrollIntoView({behavior:'smooth', block:'center'});
  d.classList.remove('hit'); void d.offsetWidth; d.classList.add('hit');
}

function newsHtml(n){
  const url = safeUrl(n.url);
  const date = n.from ? (() => { const p = P(new Date(n.from)); return `${p.year}.${String(p.month).padStart(2,'0')}.${String(p.day).padStart(2,'0')}`; })() : '';
  const tag = n.important ? `<span class="tag">${esc(t('notice.important'))}</span>` : (n.notice ? `<span class="tag ntc">${esc(t('notice.featured'))}</span>` : '');
  return `<div class="nitem${n.important?' imp':(n.notice?' ntc':'')}"><div class="nhead">${date?`<span class="nd">${esc(date)}</span>`:''}${tag}<span class="nt">${esc(n.title)}</span></div>${n.body?`<p class="nb">${esc(n.body)}</p>`:''}${url?`<a class="nmore" href="${esc(url)}" target="_blank" rel="noopener" data-track data-kind="notice" data-id="${esc(n.id)}" data-label="${esc(n.title)}">${esc(t('btn.notice_more'))} ↗</a>`:''}</div>`;
}

function linkHtml(l){
  const u = safeUrl(l.url); if (!u) return '';
  const key = String(l.icon||'').toLowerCase();
  const icon = BRAND[key] || ICON[key] || ICON.link;
  return `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener" data-track data-kind="link" data-id="link:${esc(l.label)}" data-label="${esc(l.label)}" title="${esc(l.desc||l.label)}"><span class="ic">${icon}</span><span class="lnm">${esc(l.label)}</span></a>`;
}

/* ふわっと現れる動き */
const io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px", threshold:.05})
  : null;
function stagger(el){
  [...el.children].forEach((c, i) => {
    c.classList.add("rv"); c.style.setProperty("--i", Math.min(i, 6));
    if (io) io.observe(c); else c.classList.add("in");
  });
}

/* 「次の予定」：題名が入りきらないときは、流れるメッセージにする */
let lastTitle = "";
function setMarquee(text){
  lastTitle = text;
  const box = $("nTitleBox"), mq = $("nTitle");
  box.classList.remove("run");
  mq.style.animation = "none";
  mq.innerHTML = '<span class="mt"></span>';
  mq.firstChild.textContent = text;
  requestAnimationFrame(() => {
    if ($("next").hidden) return;
    const w = mq.firstChild.offsetWidth;
    if (w - 48 > box.clientWidth + 1){
      const g = document.createElement("span");
      g.className = "mt"; g.setAttribute("aria-hidden", "true"); g.textContent = text;
      mq.appendChild(g);
      mq.style.setProperty("--w", w + "px");
      mq.style.setProperty("--d", Math.round(w / 45) + "s");
      box.classList.add("run");
    }
    mq.style.animation = "";
  });
}
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (lastTitle) setMarquee(lastTitle); }, 200); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (lastTitle) setMarquee(lastTitle); });

let state = null, lastSig = '', openKeys = new Set(), first = true, nextId = null;

function visible(now){
  return (state.items||[]).filter(it => it.title && !status(it, now).ended)
    .sort((a,b)=> (a.start?new Date(a.start).getTime():9e15) - (b.start?new Date(b.start).getTime():9e15));
}

function applyText(){
  document.title = t('site.tab_title');
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  const home = safeUrl(t('url.home')) || '#';
  $('homeBtn').href = home;
  $('lead').hidden = !t('page.lead').trim();
  const lk = (id, urlKey, labelKey) => `<a href="${esc(safeUrl(t(urlKey)) || '#')}" target="_blank" rel="noopener" data-track data-kind="link" data-id="link:${id}" data-label="${esc(t(labelKey))}">${esc(t(labelKey))}</a>`;
  $('noteBox').innerHTML = tx('page.note', { keijiban: lk('keijiban','url.keijiban','note.keijiban_label'), post: lk('post-request','url.post_request','note.post_label') });
  const logo = safeUrl(t('site.logo_url'));
  $('logo').src = logo || DEFAULT_LOGO;
  const off = /^(なし|off|false|0|いいえ)$/i.test(t('fx.enabled').trim());
  $('egg').hidden = off;
}

function renderContact(){
  const list = (state && state.contacts && state.contacts.length) ? state.contacts : DEFAULT_CONTACTS;
  const btns = list.map((c, i) => { const u = safeUrl(c.url); if (!u) return '';
    return `<a class="btn ${i===0?'fill':'line'}" href="${esc(u)}" ${u.startsWith('mailto:')?'':'target="_blank" rel="noopener"'} data-track data-kind="link" data-id="link:contact-${esc(c.label)}" data-label="${esc(t('sec.contact'))} ${esc(c.label)}">${esc(c.label)}</a>`; }).join('');
  const subs = list.filter(c => c.text).map(c => `<p class="addr">${esc(c.text)}</p>`).join('');
  $('contactBox').innerHTML = `<div class="who">${esc(t('contact.title'))}</div><p class="hours">${esc(t('contact.hours'))}</p><div class="cb">${btns}</div>${subs}`;
  stagger($('contactBox'));
}

function render(){
  CFG = (state && state.config) || {};
  applyText();
  const now = new Date();
  $$('details[open]').forEach(d => openKeys.add(d.dataset.key));
  $$('details:not([open])').forEach(d => openKeys.delete(d.dataset.key));
  const items = visible(now);
  const vol = items.filter(i=>!isEvent(i)), ev = items.filter(isEvent), feat = items.filter(i=>i.featured);
  first = false;

  /* お知らせ */
  const rank = n => n.important ? 2 : n.notice ? 1 : 0;
  const ns = (state.notices||[]).filter(n => (!n.from || now >= new Date(n.from)) && (!n.to || now <= new Date(n.to)))
    .sort((a,b)=> rank(b) - rank(a));
  $('news').hidden = !ns.length;
  $('newsList').innerHTML = ns.map(newsHtml).join('');
  stagger($('newsList'));

  /* 次の予定 */
  const nx = vol.find(i => i.start && !status(i, now).closed) || vol.find(i => i.start);
  nextId = nx ? nx.id : null;
  $('next').hidden = !nx;
  if (nx) { $('nDate').textContent = chipDate(nx); setMarquee(nx.title); }

  /* 注目・一覧 */
  $('featured').hidden = !feat.length;
  $('featList').innerHTML = feat.map(featHtml).join('');
  stagger($('featList'));
  const cnt = (el, n) => { el.hidden = !n; el.textContent = n + t('sec.count_unit'); };
  cnt($('volCnt'), vol.length); cnt($('evCnt'), ev.length);
  $('volList').innerHTML = vol.length ? vol.map(i => cardHtml(i, now, i.id)).join('') : `<p class="empty">${esc(t('empty.volunteer'))}</p>`;
  $('evList').innerHTML = ev.length ? ev.map(i => cardHtml(i, now, i.id)).join('') : `<p class="empty">${esc(t('empty.events'))}</p>`;
  stagger($('volList')); stagger($('evList'));
  $$('details').forEach(d => { if (openKeys.has(d.dataset.key)) d.open = true; });

  /* Q＆A */
  const faq = (state.faq || []).filter(f => f.q);
  $('faq').hidden = !faq.length;
  $('faqList').innerHTML = faq.map(faqHtml).join('');
  stagger($('faqList'));
  $$('#faqList details').forEach(d => { if (openKeys.has(d.dataset.key)) d.open = true; });

  /* リンク・お問い合わせ */
  const links = (state.links && state.links.length) ? state.links : DEFAULT_LINKS;
  $('linkList').innerHTML = links.map(linkHtml).join('');
  stagger($('linkList'));
  renderContact();

  $('updated').textContent = state.updated ? t('footer.updated').replace('{date}', fmtDT(new Date(state.updated), false)) : '';
  buildNav();
  lastSig = signature(now);
}

function signature(now){
  return visible(now).map(i => { const s=status(i,now); return [i.id,s.live,s.closed,s.dl,s.left].join(':'); }).join('|');
}
function tick(){
  if (!state) return;
  if (signature(new Date()) !== lastSig) render();
}

/* =========================================================
   ナビ：押すとその場所へ。いま見ている場所に印がつく
   ========================================================= */
const SECS_ALL = ['news','featured','volunteer','events','faq','links','contact'];
let SECS = [], current = null, lock = null;
const navin = $('navin'), ind = $('ind');
function buildNav(){
  SECS = SECS_ALL.filter(k => !$(k).hidden);
  [...navin.querySelectorAll('a')].forEach(a => a.remove());
  SECS.forEach(k => {
    const a = document.createElement('a');
    a.href = '#' + k; a.id = 'n-' + k;
    a.innerHTML = '<span class="ti">' + NAVICON[k] + '</span><span class="tl">' + esc(t('nav.' + k)) + '</span>';
    navin.appendChild(a);
  });
  current = null; spy();
}
function moveInd(){
  const a = current && $('n-' + current);
  if (!a){ ind.style.width = '0'; return; }
  ind.style.width = a.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + a.offsetLeft + 'px)';
}
function setCurrent(id){
  if (id === current) return;
  current = id;
  SECS.forEach(k => { const a = $('n-' + k); if (!a) return; if (k === id) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
  moveInd();
}
function spy(){
  $('egg').classList.toggle('show', innerHeight + scrollY >= document.documentElement.scrollHeight - 120);
  if (lock) return;
  const mobile = matchMedia('(max-width:720px)').matches;
  const line = mobile ? 120 : $('nav').offsetHeight + 80;
  let id = null;
  SECS.forEach(k => { if ($(k).getBoundingClientRect().top <= line) id = k; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && SECS.length) id = SECS[SECS.length - 1];
  setCurrent(id);
}
navin.addEventListener('click', e => { const a = e.target.closest('a'); if (a){ lock = a.id.slice(2); setCurrent(lock); } });
['wheel','touchstart','keydown','mousedown'].forEach(ev => addEventListener(ev, () => { lock = null; }, {passive:true}));
let ticking = false;
addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, {passive:true});
addEventListener('resize', () => { moveInd(); spy(); });
function goTo(id){ const el = $(id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
$('toTop').addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));
$('next').addEventListener('click', () => {
  if (!nextId) return;
  trackClick('next', nextId, ($('nTitle').firstChild || {}).textContent || nextId);
  const d = document.querySelector(`#volList details[data-key="${CSS.escape(nextId)}"]`);
  if (d) { d.open = true; openKeys.add(d.dataset.key); d.scrollIntoView({behavior:'smooth', block:'center'}); }
});

/* =========================================================
   計測（閲覧数・クリック数）
   ========================================================= */
function vid(){
  try { let v = localStorage.getItem('kct_vid'); if (!v) { v = 'v' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); localStorage.setItem('kct_vid', v); } return v; }
  catch(e){ return 'anon'; }
}
function demoLog(p){
  try { const a = JSON.parse(localStorage.getItem('kct_demo_log')||'[]'); a.push({t:new Date().toISOString(), ...p}); localStorage.setItem('kct_demo_log', JSON.stringify(a.slice(-5000))); } catch(e){}
}
function send(p){
  p.vid = vid();
  if (!CONFIG.API_URL) { demoLog(p); return; }
  const body = JSON.stringify(p);
  try { if (navigator.sendBeacon && navigator.sendBeacon(CONFIG.API_URL, new Blob([body], {type:'text/plain;charset=UTF-8'}))) return; } catch(e){}
  fetch(CONFIG.API_URL, {method:'POST', body, keepalive:true, mode:'no-cors'}).catch(()=>{});
}
function trackView(){
  try { if (sessionStorage.getItem('kct_viewed')) return; sessionStorage.setItem('kct_viewed','1'); } catch(e){}
  send({action:'track', type:'view', kind:'page', id:'page', label:'ページ閲覧'});
}
function trackClick(kind, id, label){ send({action:'track', type:'click', kind, id:String(id||'').slice(0,80), label:String(label||'').slice(0,120)}); }

function aggregate(rows){
  const key = d => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d);
  const today = key(new Date());
  const days = []; for (let i=6;i>=0;i--) days.push({d:key(new Date(Date.now()-i*86400000)), v:0, c:0});
  const out = {ok:true, views:0, viewsToday:0, clicks:0, clicksToday:0, visitors:0, daily:days, ranking:[]};
  const vis = new Set(), map = new Map();
  rows.forEach(r => {
    const k = key(new Date(r.t)), day = days.find(x=>x.d===k);
    if (r.type === 'view') { out.views++; vis.add(r.vid); if (k===today) out.viewsToday++; if (day) day.v++; }
    else if (r.type === 'click') {
      out.clicks++; if (k===today) out.clicksToday++; if (day) day.c++;
      if (!map.has(r.id)) map.set(r.id, {id:r.id, label:r.label, kinds:{}, total:0});
      const m = map.get(r.id); m.label = r.label; m.kinds[r.kind] = (m.kinds[r.kind]||0)+1; m.total++;
    }
  });
  out.visitors = vis.size; out.ranking = [...map.values()].sort((a,b)=>b.total-a.total).slice(0,30);
  return out;
}

const dlg = $('adminDlg'), ab = $('adminBody');
let adminPin = '';

function openAdmin(){
  ab.innerHTML = `<form class="pin-form" id="pinForm" autocomplete="off">
    <label for="pin" style="font-weight:700;color:var(--deep)">${esc(t('admin.pin_label'))}</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <button class="btn fill" type="submit">${esc(t('admin.pin_open'))}</button>
    <p class="err" id="pinErr" role="alert"></p>
    ${CONFIG.API_URL ? '' : '<p class="tiny">※デモ表示中のPINは「'+CONFIG.DEMO_PIN+'」です。</p>'}
  </form>`;
  dlg.showModal();
  setTimeout(()=>$('pin')?.focus(), 50);
  $('pinForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('pin').value.trim(), err = $('pinErr'), btn = $('pinForm').querySelector('button');
    if (!/^\d{4,8}$/.test(pin)) { err.textContent = t('admin.pin_format'); return; }
    btn.disabled = true; err.textContent = '…';
    try { const s = await getStats(pin); adminPin = pin; showStats(s); }
    catch(x){ err.textContent = x.message || 'error'; $('pin').value=''; btn.disabled = false; $('pin').focus(); }
  });

async function getStats(pin){
  if (!CONFIG.API_URL) {
    if (pin !== CONFIG.DEMO_PIN) throw new Error(t('admin.pin_wrong'));
    return aggregate(JSON.parse(localStorage.getItem('kct_demo_log')||'[]'));
  }
  const r = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify({action:'stats', pin})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || t('admin.pin_wrong'));
  return j;
}

const nf = n => Number(n||0).toLocaleString('ja-JP');

function chartSvg(daily){
  const W=600, H=210, pt=26, pb=34, px=14, n=daily.length;
  const max = Math.max(4, ...daily.map(d=>Math.max(d.v,d.c)));
  const gw = (W-px*2)/n, bw = gw*.32, y = v => pt + (H-pt-pb)*(1 - v/max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('admin.chart_title'))}" style="width:100%;height:auto">
    <line x1="${px}" y1="${H-pb}" x2="${W-px}" y2="${H-pb}" stroke="#cfdcf6" stroke-width="2"/>`;
  daily.forEach((d,i) => {
    const x0 = px + gw*i + gw/2, md = d.d.slice(5).replace('-','/');
    s += `<rect x="${x0-bw-2}" y="${y(d.v)}" width="${bw}" height="${H-pb-y(d.v)}" rx="2" fill="#2f5be0"/>
          <rect x="${x0+2}" y="${y(d.c)}" width="${bw}" height="${H-pb-y(d.c)}" rx="2" fill="#a35f00"/>
          <text x="${x0-bw/2-2}" y="${y(d.v)-5}" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2125">${d.v}</text>
          <text x="${x0+bw/2+2}" y="${y(d.c)-5}" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2125">${d.c}</text>
          <text x="${x0}" y="${H-12}" text-anchor="middle" font-size="13" font-weight="700" fill="#37424a">${md}</text>`;
  });
  return s + '</svg>';
}

function showStats(s){
  const top = Math.max(1, ...(s.ranking||[]).map(r=>r.total));
  const rows = (s.ranking||[]).map(r => {
    const k = r.kinds||{}, other = (r.total||0) - (k.apply||0) - (k.detail||0);
    return `<tr><td>${esc(r.label||r.id)}<div class="bar" style="width:${Math.round(r.total/top*100)}%"></div></td><td>${nf(k.apply)}</td><td>${nf(k.detail)}</td><td>${nf(other)}</td><td><b>${nf(r.total)}</b></td></tr>`;
  }).join('') || `<tr><td colspan="5" style="text-align:center">${esc(t('admin.empty'))}</td></tr>`;
  const sheet = safeUrl(s.sheetUrl || CONFIG.SHEET_URL);
  const today = esc(t('admin.kpi_today'));
  ab.innerHTML = `
    ${CONFIG.API_URL ? '' : '<p class="tiny">※デモ表示：このブラウザ内の記録のみを集計しています。</p>'}
    <div class="kpis">
      <div class="kpi"><span>${esc(t('admin.kpi_views'))}</span><b>${nf(s.views)}</b><br><small>${today} ${nf(s.viewsToday)}</small></div>
      <div class="kpi"><span>${esc(t('admin.kpi_visitors'))}</span><b>${nf(s.visitors)}</b><br><small>${esc(t('admin.kpi_visitors_note'))}</small></div>
      <div class="kpi"><span>${esc(t('admin.kpi_clicks'))}</span><b>${nf(s.clicks)}</b><br><small>${today} ${nf(s.clicksToday)}</small></div>
    </div>
    <h3 class="adm-h">${esc(t('admin.chart_title'))}</h3>
    <div class="legend"><span><i style="background:#2f5be0"></i>${esc(t('admin.legend_views'))}</span><span><i style="background:#a35f00"></i>${esc(t('admin.legend_clicks'))}</span></div>
    ${chartSvg(s.daily||[])}
    <h3 class="adm-h">${esc(t('admin.rank_title'))}</h3>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${esc(t('admin.col_item'))}</th><th>${esc(t('admin.col_apply'))}</th><th>${esc(t('admin.col_detail'))}</th><th>${esc(t('admin.col_other'))}</th><th>${esc(t('admin.col_total'))}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="tiny" style="margin-top:6px">${esc(t('admin.rank_note'))}</p>
    <div class="adm-actions">
      <button class="btn fill" type="button" id="admRefresh">${esc(t('admin.refresh'))}</button>
      ${sheet ? `<a class="btn line" href="${esc(sheet)}" target="_blank" rel="noopener">${esc(t('admin.open_sheet'))}${ICON_EXT}</a>` : ''}
      <button class="btn line" type="button" id="admOut">${esc(t('admin.logout'))}</button>
    </div>`;
  $('admRefresh').onclick = async () => { try { showStats(await getStats(adminPin)); } catch(e){ alert(e.message); } };
  $('admOut').onclick = () => { adminPin = ''; dlg.close(); };
}

/* =========================================================
   左下のごみ拾いアイコン → 画面いっぱいのアニメーション（約5秒）
   ========================================================= */
(function(){
  const btn = $('egg'), fx = $('fx'), cv = $('fxc'), ctx = cv.getContext('2d'), msgBox = $('fxmsg');
  let running = false, done = true, raf = 0, timer = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = p => p * p * (3 - 2 * p);
  const msgs = () => t('fx.title').split(/[\/／\n]/).map(x => x.trim()).filter(Boolean);

  /* ごみの絵（中心が原点、だいたい40pxの大きさ） */
  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function ink(){ ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(40,55,90,.55)'; ctx.stroke(); }
  const DRAW = {
    can(c){ rr(-9, -14, 18, 28, 4); ctx.fillStyle = c; ctx.fill(); ink(); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-9, -4, 18, 8); ctx.beginPath(); ctx.ellipse(0, -14, 9, 3, 0, 0, 7); ctx.fillStyle = '#cfd6e2'; ctx.fill(); ink(); },
    bottle(c){ rr(-8, -6, 16, 22, 5); ctx.fillStyle = 'rgba(170,220,238,.9)'; ctx.fill(); ink(); rr(-4, -14, 8, 9, 2); ctx.fillStyle = 'rgba(170,220,238,.9)'; ctx.fill(); ink(); ctx.fillStyle = c; ctx.fillRect(-5, -19, 10, 5); ctx.fillRect(-8, 2, 16, 6); },
    paper(){ ctx.beginPath(); for (let i = 0; i < 10; i++){ const a = i / 10 * 6.2832, r = i % 2 ? 10 : 14; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fillStyle = '#f7f8fb'; ctx.fill(); ink(); ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(3, 2); ctx.moveTo(-2, 7); ctx.lineTo(6, -5); ctx.strokeStyle = 'rgba(40,55,90,.3)'; ctx.stroke(); },
    leaf(c){ ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, 7); ctx.fillStyle = c; ctx.fill(); ink(); ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(14, 0); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke(); },
    wrap(c){ ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-12, -4); ctx.lineTo(-16, 0); ctx.lineTo(-12, 4); ctx.lineTo(-16, 8); ctx.lineTo(16, 8); ctx.lineTo(12, 4); ctx.lineTo(16, 0); ctx.lineTo(12, -4); ctx.lineTo(16, -8); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ink(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(-7, -3, 14, 6); },
    boot(c){ ctx.beginPath(); ctx.moveTo(-7, -17); ctx.lineTo(5, -17); ctx.lineTo(5, 3); ctx.lineTo(17, 6); ctx.quadraticCurveTo(20, 15, 12, 15); ctx.lineTo(-7, 15); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ink(); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-7, -17, 12, 4); }
  };
  const KINDS = [['can', ['#d6335a', '#4a78e0', '#b8c2d0', '#3aa66a']], ['can', ['#d6335a', '#4a78e0', '#b8c2d0']], ['bottle', ['#4a78e0', '#d6335a']], ['paper', ['']], ['paper', ['']], ['leaf', ['#5aa65a', '#c98a2e', '#8fb83a']], ['leaf', ['#5aa65a', '#c98a2e']], ['wrap', ['#ff9db5', '#ffd24a', '#7fd0e8']], ['wrap', ['#ff9db5', '#ffd24a']], ['boot', ['#2f5be0', '#e8b92b']]];

  /* ごみ袋（足元が原点。k はゴミが入ったときのふくらみ） */
  function bag(x, y, s, k){
    ctx.save(); ctx.translate(x, y); ctx.scale(s * (1 + k * 0.07), s * (1 - k * 0.09));
    ctx.beginPath(); ctx.moveTo(-12, -82); ctx.bezierCurveTo(-48, -66, -58, -20, -40, -4); ctx.quadraticCurveTo(0, 8, 40, -4); ctx.bezierCurveTo(58, -20, 48, -66, 12, -82); ctx.closePath();
    ctx.fillStyle = '#2f5be0'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(19,38,90,.7)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-20, -42, 7, 20, 0.35, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12, -82); ctx.lineTo(-22, -98); ctx.lineTo(-6, -90); ctx.lineTo(0, -102); ctx.lineTo(6, -90); ctx.lineTo(22, -98); ctx.lineTo(12, -82); ctx.closePath();
    ctx.fillStyle = '#2f5be0'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function star(x, y, r, rot){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4 - Math.PI / 2, r2 = i % 2 ? r * 0.28 : r; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r2, Math.sin(a) * r2); }
    ctx.closePath(); ctx.restore();
  }

  let W, H, items, sparks, count, bx, by, bs, pulses;
  const PICK0 = 1.15, PICK1 = 3.0, FLY = 0.6, T = 5.2;
  function build(){
    W = innerWidth; H = innerHeight;
    const sc = clamp(Math.min(W, H) / 620, 0.8, 1.3);
    count = clamp(Math.round(W * H / 17000), 26, 64);
    bs = clamp(Math.min(W, H) / 520, 0.9, 1.5);
    bx = W / 2; by = H - Math.max(24, 18 + bs * 8) - (W < 720 ? 76 : 0);
    const order = Array.from({length: count}, (_, i) => i).sort(() => Math.random() - 0.5);
    items = [];
    for (let i = 0; i < count; i++){
      const kd = KINDS[Math.floor(Math.random() * KINDS.length)], y = rnd(70, H - 150 * bs);
      items.push({ f: DRAW[kd[0]], c: kd[1][Math.floor(Math.random() * kd[1].length)], x: rnd(30, W - 30), y,
        rot: rnd(0, 6.28), spin: rnd(-4, 4), ds: rnd(0, 0.5), dur: rnd(0.45, 0.6), s: sc * rnd(0.9, 1.25),
        tp: PICK0 + order[i] / count * (PICK1 - PICK0) });
    }
    pulses = items.map(it => it.tp + FLY).sort((a, b) => a - b);
    sparks = [];
    for (let i = 0; i < 26; i++) sparks.push({ x: rnd(20, W - 20), y: rnd(20, H - 20), r: rnd(10, 26), ts: 3.4 + rnd(0, 1.1), life: rnd(0.6, 1.0), c: ['#f5b82e', '#ffffff', '#2f5be0', '#f5b82e'][i % 4] });
  }
  function draw(t){
    ctx.clearRect(0, 0, W, H);
    const a = Math.min(1, t / 0.35) * 0.97;
    ctx.fillStyle = 'rgba(238,243,253,' + a + ')'; ctx.fillRect(0, 0, W, H);
    /* 拾った数に応じて、汚れた色がうすくなる */
    let got = 0; for (let i = 0; i < pulses.length; i++) if (pulses[i] <= t) got++;
    const fadeDirt = clamp((t - 0.2) / 0.4, 0, 1);
    ctx.fillStyle = 'rgba(120,105,80,' + (0.15 * fadeDirt * (1 - got / count)) + ')'; ctx.fillRect(0, 0, W, H);
    /* ごみ */
    for (let i = 0; i < items.length; i++){
      const it = items[i];
      if (t < it.ds) continue;
      const tx = bx, ty = by - 70 * bs;
      let x = it.x, y, rot = it.rot, sc = it.s;
      if (t < it.tp){
        const p = clamp((t - it.ds) / it.dur, 0, 1);
        y = -80 + (it.y + 80) * p * p;
        if (p < 1) rot += it.spin * (1 - p) * 2;
        else { const tb = t - it.ds - it.dur; if (tb < 0.22) y -= 14 * Math.sin(tb * Math.PI / 0.22) * (1 - tb / 0.22); }
      } else {
        const q = (t - it.tp) / FLY;
        if (q >= 1) continue;
        const e = smooth(q);
        x = it.x + (tx - it.x) * e;
        y = it.y + (ty - it.y) * e - Math.sin(q * Math.PI) * 120;
        rot += q * 5; sc = it.s * (1 - 0.7 * e);
        if (q < 0.18){ /* つかむ：ちょっと持ち上がる光 */
          ctx.beginPath(); ctx.arc(it.x, it.y, 26 * it.s * (1 - q / 0.18) + 6, 0, 7); ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * (1 - q / 0.18)) + ')'; ctx.fill();
        }
      }
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); it.f(it.c); ctx.restore();
    }
    /* ごみ袋：入るたびにぷるっとふくらむ */
    let k = 0;
    for (let i = 0; i < pulses.length; i++){ const d = t - pulses[i]; if (d >= 0 && d < 0.18) k = Math.max(k, Math.sin(d / 0.18 * Math.PI)); }
    const grow = 1 + 0.22 * (got / count);
    const appear = clamp((t - 0.5) / 0.4, 0, 1);
    if (appear > 0) bag(bx, by + (1 - appear) * 160, bs * grow, k);
    /* きらきら */
    for (let i = 0; i < sparks.length; i++){
      const s = sparks[i], u = (t - s.ts) / s.life;
      if (u < 0 || u > 1) continue;
      star(s.x, s.y, s.r * Math.sin(u * Math.PI), u * 1.4);
      ctx.fillStyle = s.c; ctx.fill();
      if (s.c === '#ffffff'){ ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(47,91,224,.5)'; ctx.stroke(); }
    }
  }

  function finish(){
    if (done) return; done = true;
    cancelAnimationFrame(raf); clearTimeout(timer);
    fx.style.transition = 'opacity .45s'; fx.style.opacity = '0';
    setTimeout(() => { fx.hidden = true; msgBox.classList.remove('show'); running = false; }, 480);
  }
  function start(){
    if (running) return;
    running = true; done = false;
    trackClick('fx', 'fx:egg', 'ごみ拾いアニメーション');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    build();
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    $('fxlogo').src = $('logo').src;
    const ms = msgs();
    $('fxbig').textContent = ms.length ? ms[Math.floor(Math.random() * ms.length)] : '';
    $('fxsub').textContent = t('fx.sub').replace('{n}', count);
    msgBox.classList.remove('show'); void msgBox.offsetWidth;
    fx.style.transition = 'none'; fx.style.opacity = '1'; fx.hidden = false;
    if (reduce){
      ctx.fillStyle = 'rgba(238,243,253,.97)'; ctx.fillRect(0, 0, W, H);
      msgBox.classList.add('show'); timer = setTimeout(finish, 2600); return;
    }
    let t0 = 0, shown = false;
    function frame(now){
      if (done) return;
      if (!t0) t0 = now;
      const tt = (now - t0) / 1000;
      draw(tt);
      if (tt > 3.4 && !shown){ shown = true; msgBox.classList.add('show'); }
      if (tt >= T){ finish(); return; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }
  btn.addEventListener('click', start);
  fx.addEventListener('click', finish);
  addEventListener('keydown', e => { if (e.key === 'Escape') finish(); });
  window.__fx = { start, draw, build };
})();

/* =========================================================
   データ取得
   ========================================================= */
async function load(){
  const bar = $('statusBar');
  if (!CONFIG.API_URL) {
    state = DEMO; CFG = {};
    bar.innerHTML = `<div class="demo-bar">${esc(t('msg.demo'))}</div>`;
    return;
  }
  try {
    const r = await fetch(CONFIG.API_URL + '?action=data&_=' + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error('bad');
    state = j; CFG = j.config || {}; bar.innerHTML = '';
    try { localStorage.setItem('kct_cache', JSON.stringify(j)); } catch(e){}
  } catch(e) {
    let c = null; try { c = JSON.parse(localStorage.getItem('kct_cache')||'null'); } catch(_){}
    if (c) { state = c; CFG = c.config || {}; bar.innerHTML = `<div class="warn-bar">${esc(t('msg.cached'))}</div>`; }
    else { state = {items:[], notices:[], links:[], contacts:[], faq:[], config:{}}; CFG = {}; bar.innerHTML = `<div class="warn-bar">${esc(t('msg.failed'))}</div>`; }
  }
}

/* =========================================================
   イベント
   ========================================================= */
document.addEventListener('click', e => {
  const fc = e.target.closest('[data-go-item]');
  if (fc) { const it = (state.items||[]).find(i => i.id === fc.dataset.goItem); trackClick('featured', fc.dataset.goItem, it ? it.title : fc.dataset.goItem); goItem(fc.dataset.goItem); return; }
  const tr = e.target.closest('[data-track]');
  if (tr) trackClick(tr.dataset.kind, tr.dataset.id, tr.dataset.label);
  const sm = e.target.closest('summary');
  if (sm) {
    const d = sm.parentElement;
    if (!d.open) { const it = (state.items||[]).find(i => i.id === d.dataset.id); trackClick('detail', d.dataset.id, it ? it.title : (d.dataset.label || d.dataset.id)); }
  }
});
$('adminOpen').addEventListener('click', openAdmin);
$('adminClose').addEventListener('click', () => { adminPin=''; dlg.close(); });
dlg.addEventListener('click', e => { if (e.target === dlg) { adminPin=''; dlg.close(); } });

/* 起動 */
(async () => {
  await load();
  render();
  trackView();
  setInterval(tick, 60 * 1000);
  if (CONFIG.API_URL) setInterval(async () => { await load(); render(); }, CONFIG.REFRESH_MS);
})();
})();
</script>
